<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>She Said Yes ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#ff758c,#ff4d6d,#000);
  color:white;
  text-align:center;
  font-family:"Poppins",sans-serif;
  overflow:hidden;
}

.box{
  animation:fadeIn 2s ease forwards;
  opacity:0;
}

h1{
  font-size:52px;
  margin-bottom:20px;
  text-shadow:0 0 20px #fff;
}

p{
  font-size:22px;
  line-height:1.6;
}

@keyframes fadeIn{
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="box">
  <h1>Khushi said YES 💕</h1>
  <p>
    From this moment…  
    every smile of yours is my responsibility ❤️  
  </p>
  <p>
    Happy Valentine’s Day, Khushi 🌹  
  </p>
</div>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

</body>
</html>
