<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yay ❤️</title>

<style>
  body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
    text-align:center;
    font-family:"Poppins",sans-serif;
    overflow:hidden;
  }

  h1{
    font-size:50px;
    animation:pop 1s ease forwards;
  }

  p{
    font-size:22px;
    margin-top:15px;
    opacity:0;
    animation:fade 2s ease 1s forwards;
  }

  @keyframes pop{
    from{transform:scale(0);}
    to{transform:scale(1);}
  }

  @keyframes fade{
    to{opacity:1;}
  }
</style>
</head>

<body>

<div>
  <h1>YAYYY Khushi!!! 💕</h1>
  <p>You are officially my Valentine now 😘</p>
  <p>I promise to make you smile every single day ❤️</p>
</div>

</body>
</html>
