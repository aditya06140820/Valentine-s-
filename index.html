<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Khushi ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:black;
  color:white;
  overflow:hidden;
}

/* cinematic fade */
.fade{
  position:fixed;
  inset:0;
  background:black;
  animation:fadeOut 3s forwards 2s;
  z-index:5;
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* floating hearts */
.heart{
  position:absolute;
  width:18px;height:18px;
  background:#ff4d6d;
  transform:rotate(45deg);
  animation:float 8s linear infinite;
  opacity:.5;
}
.heart::before,.heart::after{
  content:"";position:absolute;
  width:18px;height:18px;
  background:#ff4d6d;border-radius:50%;
}
.heart::before{top:-9px;}
.heart::after{left:-9px;}

@keyframes float{
  from{transform:translateY(100vh) rotate(45deg);}
  to{transform:translateY(-10vh) rotate(45deg);}
}

.container{
  text-align:center;
  z-index:2;
}

h1{
  font-size:38px;
  margin-bottom:20px;
  min-height:60px;
}

button{
  padding:12px 26px;
  font-size:18px;
  border:none;
  border-radius:12px;
  margin:10px;
  cursor:pointer;
  transition:.3s;
}

#yes{
  background:#ff4d6d;
  color:white;
  box-shadow:0 0 15px #ff4d6d;
}

#no{
  background:#666;
  color:white;
}

#msg{
  margin-top:15px;
  font-size:18px;
  height:24px;
}
</style>
</head>

<body>

<div class="fade"></div>

<script>
/* create floating hearts */
for(let i=0;i<30;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*4)+"s";
  document.body.appendChild(h);
}
</script>

<div class="container">
  <h1 id="type"></h1>

  <button id="yes">Yes 💖</button>
  <button id="no">No 😢</button>

  <div id="msg"></div>
</div>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
</audio>

<script>
/* typewriter cinematic text */
const text = "Khushi… will you be my Valentine? ❤️";
let i = 0;
function type(){
  if(i < text.length){
    document.getElementById("type").innerHTML += text[i];
    i++;
    setTimeout(type, 70);
  }
}
setTimeout(type, 2000);

/* dramatic NO journey */
let yesSize = 18;

const msgs = [
  "Are you sure Khushi? 🥺",
  "Think again… 💭",
  "I'll wait forever… ⏳",
  "Please don't break my heart 💔",
  "You mean too much to me 😭",
  "Last chance… 😔"
];

let m = 0;

no.onclick = () => {
  msg.innerText = msgs[m % msgs.length];
  m++;

  yesSize += 10;
  yes.style.fontSize = yesSize + "px";
};

/* YES → cinematic ending */
yes.onclick = () => {
  document.body.style.transition="1.5s";
  document.body.style.opacity="0";
  setTimeout(()=> location.href="yes.html",1500);
};
</script>

</body>
</html>
