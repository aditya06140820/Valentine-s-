<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Khushi 💖</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: "Poppins", sans-serif;}

  body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
  }

  /* floating hearts */
  .heart{
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    transform:rotate(45deg);
    animation:float 6s linear infinite;
    opacity:.6;
  }
  .heart::before,.heart::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    border-radius:50%;
  }
  .heart::before{top:-10px;left:0;}
  .heart::after{left:-10px;top:0;}

  @keyframes float{
    0%{transform:translateY(100vh) rotate(45deg);}
    100%{transform:translateY(-10vh) rotate(45deg);}
  }

  .box{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    z-index:2;
  }

  h1{
    font-size:32px;
    margin-bottom:25px;
    color:#ff4d6d;
  }

  button{
    border:none;
    padding:12px 26px;
    margin:10px;
    font-size:18px;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
  }

  #yesBtn{
    background:#ff4d6d;
    color:white;
  }

  #noBtn{
    background:#999;
    color:white;
  }

  #msg{
    margin-top:15px;
    font-size:18px;
    color:#444;
  }
</style>
</head>

<body>

<!-- background hearts -->
<script>
for(let i=0;i<25;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(4+Math.random()*3)+"s";
  document.body.appendChild(h);
}
</script>

<div class="box">
  <h1>Khushi, will you be my Valentine? 💖</h1>

  <button id="yesBtn">Yes 😍</button>
  <button id="noBtn">No 😢</button>

  <p id="msg"></p>
</div>

<!-- romantic music -->
<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
</audio>

<script>
let yesSize = 18;

const msgs = [
  "Are you sure Khushi? 🥺",
  "Soch lo na… 💭",
  "Main chocolate bhi dunga 🍫",
  "Pleaseeeee 😭",
  "Dil toot jayega mera 💔",
  "Last chance Khushi 😳"
];

let i = 0;

document.getElementById("noBtn").onclick = () => {
  document.getElementById("msg").innerText = msgs[i % msgs.length];
  i++;

  yesSize += 8;
  document.getElementById("yesBtn").style.fontSize = yesSize + "px";
};

document.getElementById("yesBtn").onclick = () => {
  window.location.href = "yes.html";
};
</script>

</body>
</html>
